<div class="card">
  <div class="card-header">
    <div class="d-flex justify-content-between align-items-center">
      <h5 class="mb-0">My Tasks</h5>
      <button class="btn btn-primary btn-sm" (click)="onNewTask()">
        <i class="bi bi-plus-circle me-1"></i> New Task
      </button>
    </div>
  </div>

  <div class="card-body">
    <!-- Filters and Sorting -->
    <div class="row g-2 mb-3">
      <div class="col-md-4">
        <label class="form-label small">Sort By</label>
        <select class="form-select form-select-sm" [(ngModel)]="currentSort" (change)="onSortChange(currentSort)">
          <option value="date">Date</option>
          <option value="title">Title</option>
          <option value="priority">Priority</option>
          <option value="duedate">Due Date</option>
        </select>
      </div>

      <div class="col-md-4">
        <label class="form-label small">Status</label>
        <select class="form-select form-select-sm" [value]="currentFilterCompleted === null ? '' : currentFilterCompleted.toString()" (change)="onFilterCompletedChange($any($event.target).value)">
          <option value="">All</option>
          <option value="false">Pending</option>
          <option value="true">Completed</option>
        </select>
      </div>

      <div class="col-md-4">
        <label class="form-label small">Priority</label>
        <select class="form-select form-select-sm" [value]="currentFilterPriority || ''" (change)="onFilterPriorityChange($any($event.target).value)">
          <option value="">All</option>
          <option value="1">Low</option>
          <option value="2">Medium</option>
          <option value="3">High</option>
        </select>
      </div>
    </div>

    <!-- Loading Spinner -->
    <div *ngIf="loading" class="text-center py-4">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
    </div>

    <!-- Task List -->
    <div *ngIf="!loading && tasks.length > 0" class="task-list">
      <div
        *ngFor="let task of tasks"
        class="task-item"
        [class.completed]="task.isCompleted"
        (click)="selectTask(task)"
      >
        <div class="task-checkbox">
          <input
            type="checkbox"
            class="form-check-input"
            [checked]="task.isCompleted"
            (click)="toggleTaskCompletion(task, $event)"
          />
        </div>

        <div class="task-content flex-grow-1">
          <div class="d-flex justify-content-between align-items-start">
            <div>
              <h6 class="task-title mb-1" [class.text-decoration-line-through]="task.isCompleted">
                {{ task.title }}
              </h6>
              <p class="task-description mb-1" *ngIf="task.description">
                {{ task.description }}
              </p>
              <div class="task-meta">
                <span class="badge me-2" [ngClass]="getPriorityClass(task.priority)">
                  {{ getPriorityLabel(task.priority) }}
                </span>
                <small class="text-muted" *ngIf="task.dueDate">
                  <i class="bi bi-calendar me-1"></i>
                  {{ task.dueDate | date:'short' }}
                </small>
              </div>
            </div>

            <button
              class="btn btn-sm btn-outline-danger"
              (click)="deleteTask(task, $event)"
              title="Delete task"
            >
              <i class="bi bi-trash"></i>
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Empty State -->
    <div *ngIf="!loading && tasks.length === 0" class="text-center py-5">
      <i class="bi bi-inbox" style="font-size: 48px; color: #ccc;"></i>
      <p class="text-muted mt-3">No tasks found. Create your first task!</p>
    </div>
  </div>
</div>
